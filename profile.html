<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hồ sơ người dùng | SHOPVN</title>

<link rel="icon" href="assets/images/logo/favicon.ico">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/profile.css">
<link rel="stylesheet" href="assets/css/responsive.css">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Roboto',sans-serif;
}

body{
background:#f5f5f5;
color:#333;
}

a{
text-decoration:none;
color:inherit;
}

header{
background:#ee4d2d;
padding:16px 0;
color:#fff;
box-shadow:0 3px 12px rgba(0,0,0,.15);
position:sticky;
top:0;
z-index:999;
}

.header{
width:1200px;
max-width:95%;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:34px;
font-weight:900;
}

.nav{
display:flex;
gap:25px;
font-weight:500;
}

.container{
width:1200px;
max-width:95%;
margin:30px auto;
display:grid;
grid-template-columns:300px 1fr;
gap:25px;
}

.sidebar{
background:#fff;
border-radius:12px;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
height:max-content;
text-align:center;
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
margin-bottom:15px;
border:4px solid #ee4d2d;
}

.name{
font-size:20px;
font-weight:800;
margin-bottom:5px;
}

.email{
color:#777;
font-size:14px;
margin-bottom:20px;
}

.menu a{
display:block;
padding:12px;
margin-bottom:8px;
border-radius:8px;
font-weight:600;
transition:.3s;
}

.menu a:hover,
.menu a.active{
background:#fff1ed;
color:#ee4d2d;
}

.content{
background:#fff;
border-radius:12px;
padding:25px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.title{
font-size:24px;
font-weight:800;
margin-bottom:20px;
}

.form-group{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:8px;
font-weight:700;
}

input,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
outline:none;
font-size:15px;
}

input:focus,
textarea:focus{
border-color:#ee4d2d;
box-shadow:0 0 0 3px rgba(238,77,45,.15);
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.btn{
margin-top:20px;
padding:14px;
border:none;
background:#ee4d2d;
color:#fff;
font-weight:700;
border-radius:8px;
cursor:pointer;
transition:.3s;
width:100%;
}

.btn:hover{
background:#d84324;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-bottom:20px;
}

.card{
background:#fff1ed;
padding:15px;
border-radius:10px;
text-align:center;
font-weight:700;
color:#ee4d2d;
}

footer{
margin-top:40px;
background:#fff;
padding:35px;
text-align:center;
color:#777;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr;
}

.row{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<div class="header">

<div class="logo">SHOPVN</div>

<nav class="nav">

<a href="index.html">Trang chủ</a>

<a href="cart.html">Giỏ hàng</a>

<a href="orders.html">Đơn hàng</a>

<a href="login.html">Đăng xuất</a>

</nav>

</div>

</header>

<div class="container">

<aside class="sidebar">

<img class="avatar" src="assets/images/avatar/default.png">

<div class="name">Nguyễn Văn A</div>

<div class="email">nguyenvana@gmail.com</div>

<div class="stats">

<div class="card">12 Đơn</div>

<div class="card">5 Yêu thích</div>

<div class="card">VIP</div>

</div>

<div class="menu">

<a class="active" href="profile.html">👤 Hồ sơ</a>

<a href="orders.html">📦 Đơn hàng</a>

<a href="wishlist.html">❤️ Yêu thích</a>

<a href="cart.html">🛒 Giỏ hàng</a>

</div>

</aside>

<main class="content">

<div class="title">Thông tin cá nhân</div>

<form>

<div class="row">

<div class="form-group">

<label>Họ và tên</label>

<input type="text" value="Nguyễn Văn A">

</div>

<div class="form-group">

<label>Số điện thoại</label>

<input type="text" value="0912345678">

</div>

</div>

<div class="form-group">

<label>Email</label>

<input type="email" value="nguyenvana@gmail.com">

</div>

<div class="form-group">

<label>Địa chỉ</label>

<textarea rows="4">Bến Tre, Việt Nam</textarea>

</div>

<button class="btn" type="submit">Cập nhật thông tin</button>

</form>

</main>

</div>

<footer>

© 2026 SHOPVN - Mua sắm hiện đại

</footer>

</body>

</html>
