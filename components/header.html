<header class="header">

<style>

.header{
    background:#ee4d2d;
    padding:12px 0;
    color:#fff;
    font-family:'Roboto',sans-serif;
    box-shadow:0 3px 15px rgba(0,0,0,.15);
    position:sticky;
    top:0;
    z-index:999;
}

.header-container{
    width:1200px;
    max-width:95%;
    margin:auto;
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
    cursor:pointer;
}

.search{
    flex:1;
    display:flex;
    background:#fff;
    border-radius:6px;
    overflow:hidden;
}

.search input{
    flex:1;
    padding:12px 15px;
    border:none;
    outline:none;
    font-size:14px;
}

.search button{
    background:#ff6a3d;
    border:none;
    color:#fff;
    padding:0 18px;
    cursor:pointer;
    font-weight:700;
}

.nav{
    display:flex;
    align-items:center;
    gap:18px;
    font-size:14px;
    font-weight:600;
}

.nav a{
    color:#fff;
    text-decoration:none;
    transition:.3s;
    position:relative;
}

.nav a:hover{
    opacity:.9;
}

.icon{
    font-size:20px;
    cursor:pointer;
    position:relative;
}

.badge{
    position:absolute;
    top:-6px;
    right:-10px;
    background:#fff;
    color:#ee4d2d;
    font-size:11px;
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-weight:700;
}

@media(max-width:768px){
    .nav{
        display:none;
    }
}

</style>

<div class="header-container">

    <div class="logo">SHOPVN</div>

    <div class="search">
        <input type="text" placeholder="Tìm kiếm sản phẩm...">
        <button>🔍</button>
    </div>

    <div class="nav">

        <a href="index.html">Trang chủ</a>
        <a href="category.html">Danh mục</a>
        <a href="orders.html">Đơn hàng</a>

        <div class="icon">
            🛒
            <span class="badge">3</span>
        </div>

        <div class="icon">
            ❤️
            <span class="badge">5</span>
        </div>

        <div class="icon">
            👤
        </div>

    </div>

</div>

</header>
