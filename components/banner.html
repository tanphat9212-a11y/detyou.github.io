<section class="banner">

<style>

.banner{
    width:1200px;
    max-width:95%;
    margin:20px auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:15px;
}

.banner-main{
    height:320px;
    border-radius:14px;
    overflow:hidden;
    position:relative;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.banner-main img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.banner-main:hover img{
    transform:scale(1.05);
}

.banner-side{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.banner-box{
    flex:1;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    position:relative;
}

.banner-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.5s;
}

.banner-box:hover img{
    transform:scale(1.05);
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.35),transparent);
}

.text{
    position:absolute;
    bottom:15px;
    left:15px;
    color:#fff;
    font-weight:700;
    font-size:16px;
}

@media(max-width:900px){
    .banner{
        grid-template-columns:1fr;
    }

    .banner-side{
        flex-direction:row;
    }
}

@media(max-width:600px){
    .banner-side{
        flex-direction:column;
    }
}

</style>

<div class="banner-main">
    <img src="assets/images/banners/banner1.jpg" alt="banner">
    <div class="overlay"></div>
    <div class="text">Siêu Sale Mùa Hè - Giảm đến 70%</div>
</div>

<div class="banner-side">

    <div class="banner-box">
        <img src="assets/images/banners/banner2.jpg" alt="banner">
        <div class="overlay"></div>
        <div class="text">Điện thoại mới nhất</div>
    </div>

    <div class="banner-box">
        <img src="assets/images/banners/banner3.jpg" alt="banner">
        <div class="overlay"></div>
        <div class="text">Thời trang hot trend</div>
    </div>

</div>

</section>
