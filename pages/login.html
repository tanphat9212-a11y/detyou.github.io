<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    width:380px;
    background:#fff;
    padding:35px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    color:#ee4d2d;
    font-size:30px;
    font-weight:700;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.input-group input:focus{
    border-color:#ee4d2d;
}

.password{
    position:relative;
}

.password span{
    position:absolute;
    right:15px;
    top:13px;
    cursor:pointer;
}

.options{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:20px;
}

.options a{
    text-decoration:none;
    color:#ee4d2d;
}

button{
    width:100%;
    padding:12px;
    background:#ee4d2d;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#d63f20;
}

.register{
    text-align:center;
    margin-top:20px;
}

.register a{
    color:#ee4d2d;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="login-box">

<div class="logo">
Shop Online
</div>

<form>

<div class="input-group">
<label>Email hoặc SĐT</label>
<input type="text" id="username" placeholder="Nhập tài khoản">
</div>

<div class="input-group password">
<label>Mật khẩu</label>
<input type="password" id="password" placeholder="Nhập mật khẩu">
<span onclick="showPassword()">👁</span>
</div>

<div class="options">
<label><input type="checkbox"> Ghi nhớ</label>
<a href="#">Quên mật khẩu?</a>
</div>

<button type="submit">
Đăng nhập
</button>

</form>

<div class="register">
Chưa có tài khoản?
<a href="register.html">Đăng ký</a>
</div>

</div>

<script>
function showPassword(){
    const pass=document.getElementById("password");

    if(pass.type==="password"){
        pass.type="text";
    }else{
        pass.type="password";
    }
}

document.querySelector("form").addEventListener("submit",function(e){

    e.preventDefault();

    let user=document.getElementById("username").value.trim();
    let pass=document.getElementById("password").value.trim();

    if(user===""||pass===""){
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
    }

    alert("Đăng nhập thành công!");
    window.location="../index.html";

});
</script>

</body>
</html>
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    width:400px;
    background:#fff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,.1);
}
h2{
    text-align:center;
    color:#ee4d2d;
    margin-bottom:20px;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ddd;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    background:#ee4d2d;
    color:#fff;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
button:hover{
    background:#d84324;
}
p{
    text-align:center;
    margin-top:15px;
}
a{
    color:#ee4d2d;
    text-decoration:none;
}
</style>

</head>
<body>

<div class="box">

<h2>Đăng ký</h2>

<form id="registerForm">

<input type="text" id="name" placeholder="Họ và tên">

<input type="email" id="email" placeholder="Email">

<input type="password" id="pass" placeholder="Mật khẩu">

<input type="password" id="repass" placeholder="Nhập lại mật khẩu">

<button>Đăng ký</button>

</form>

<p>Đã có tài khoản?
<a href="login.html">Đăng nhập</a>
</p>

</div>

<script>

document.getElementById("registerForm").onsubmit=function(e){

e.preventDefault();

let name=name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let pass=document.getElementById("pass").value;
let repass=document.getElementById("repass").value;

if(name==""||email==""||pass==""){
    alert("Vui lòng nhập đầy đủ thông tin");
    return;
}

if(pass!=repass){
    alert("Mật khẩu không khớp");
    return;
}

alert("Đăng ký thành công");

location.href="login.html";

}

</script>

</body>
</html>
