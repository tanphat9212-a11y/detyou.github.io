<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ee4d2d, #ff7337);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 360px;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      color: #ee4d2d;
      margin-bottom: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: #ee4d2d;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ee4d2d;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #d9441f;
    }

    .links {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .links a {
      color: #ee4d2d;
      text-decoration: none;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .divider {
      text-align: center;
      margin: 15px 0;
      color: #aaa;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ddd;
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .social {
      display: flex;
      justify-content: space-between;
    }

    .social button {
      width: 48%;
      background: #f5f5f5;
      color: #333;
      border: 1px solid #ddd;
      font-weight: normal;
    }

    .social button:hover {
      background: #eee;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">ShopClone</div>
    <h2>Đăng nhập</h2>

    <form>
      <input type="text" placeholder="Email hoặc SĐT" required />
      <input type="password" placeholder="Mật khẩu" required />
      <button type="submit">Đăng nhập</button>
    </form>

    <div class="links">
      <a href="#">Quên mật khẩu?</a> | <a href="#">Đăng ký</a>
    </div>

    <div class="divider">HOẶC</div>

    <div class="social">
      <button>Facebook</button>
      <button>Google</button>
    </div>
  </div>

</body>
</html>
