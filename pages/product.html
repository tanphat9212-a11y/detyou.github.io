<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Giỏ hàng | DETYOU SHOP</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/header.css">
<link rel="stylesheet" href="../assets/css/footer.css">
<link rel="stylesheet" href="../assets/css/cart.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header id="header"></header>

<main>

<section class="cart-page">

<div class="container">

<div class="cart-title">

<h1>

Giỏ hàng của bạn

</h1>

</div>

<div class="cart-layout">

<div class="cart-left">

<table class="cart-table">

<thead>

<tr>

<th width="60">

<input
type="checkbox"
id="checkAll">

</th>

<th>

Sản phẩm

</th>

<th>

Đơn giá

</th>

<th>

Số lượng

</th>

<th>

Thành tiền

</th>

<th>

</th>

</tr>

</thead>

<tbody id="cartBody">

</tbody>

</table>

</div>

<div class="cart-right">

<div class="summary">

<h2>

Tóm tắt đơn hàng

</h2>

<div class="summary-row">

<span>

Tạm tính

</span>

<strong id="subTotal">

0đ

</strong>

</div>

<div class="summary-row">

<span>

Phí vận chuyển

</span>

<strong>

30.000đ

</strong>

</div>

<div class="summary-row">

<span>

Giảm giá

</span>

<strong id="discount">

0đ

</strong>

</div>

<hr>

<div class="summary-total">

<span>

Tổng thanh toán

</span>

<strong id="grandTotal">

0đ

</strong>

</div>

<div class="voucher">

<input

type="text"

id="voucher"

placeholder="Nhập mã giảm giá">

<button id="applyVoucher">

Áp dụng

</button>

</div>

<button

id="checkoutBtn"

class="checkout-btn">

Thanh toán

</button>

</div>

</div>

</div>

</div>

</section>

</main>

<footer id="footer"></footer>

<script src="../assets/js/cart.js"></script>

<script src="../assets/js/cart-page.js"></script>

</body>

</html>
