<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sản phẩm</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
    }

    header {
      background: linear-gradient(90deg, #ee4d2d, #ff7337);
      padding: 15px 20px;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
    }

    .search-box input {
      width: 300px;
      padding: 8px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    .cart {
      font-size: 14px;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .info {
      padding: 10px;
    }

    .name {
      font-size: 14px;
      margin-bottom: 5px;
      height: 40px;
      overflow: hidden;
    }

    .price {
      color: #ee4d2d;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .btn {
      width: 100%;
      padding: 8px;
      background: #ee4d2d;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .btn:hover {
      background: #d9441f;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">ShopClone</div>
  <div class="search-box">
    <input type="text" placeholder="Tìm kiếm sản phẩm..." />
  </div>
  <div class="cart">🛒 Giỏ hàng</div>
</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x300" alt="product">
    <div class="info">
      <div class="name">Áo thun nam thời trang cao cấp</div>
      <div class="price">120.000đ</div>
      <button class="btn">Thêm vào giỏ</button>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x300" alt="product">
    <div class="info">
      <div class="name">Giày sneaker thể thao nam nữ</div>
      <div class="price">350.000đ</div>
      <button class="btn">Thêm vào giỏ</button>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x300" alt="product">
    <div class="info">
      <div class="name">Tai nghe bluetooth cao cấp</div>
      <div class="price">199.000đ</div>
      <button class="btn">Thêm vào giỏ</button>
    </div>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x300" alt="product">
    <div class="info">
      <div class="name">Đồng hồ thời trang nam</div>
      <div class="price">499.000đ</div>
      <button class="btn">Thêm vào giỏ</button>
    </div>
  </div>

</div>

</body>
</html>
