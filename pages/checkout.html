<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f5f5;
    }

    header {
      background: #ee4d2d;
      color: white;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      display: flex;
      gap: 20px;
    }

    .left, .right {
      background: white;
      padding: 15px;
    }

    .left {
      flex: 2;
    }

    .right {
      flex: 1;
      height: fit-content;
    }

    h3 {
      margin-bottom: 10px;
    }

    .box {
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .item {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item img {
      width: 60px;
      height: 60px;
      object-fit: cover;
    }

    .item-info {
      flex: 1;
    }

    .price {
      color: #ee4d2d;
      font-weight: bold;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      font-size: 18px;
      font-weight: bold;
      color: #ee4d2d;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #ee4d2d;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    .payment label {
      display: block;
      margin: 5px 0;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  Thanh toán
</header>

<div class="container">

  <div class="left">

    <div class="box">
      <h3>Thông tin giao hàng</h3>
      <input type="text" placeholder="Họ và tên"/>
      <input type="text" placeholder="Số điện thoại"/>
      <input type="text" placeholder="Địa chỉ"/>
      <select>
        <option>Chọn tỉnh / thành</option>
        <option>TP.HCM</option>
        <option>Hà Nội</option>
        <option>Cần Thơ</option>
      </select>
    </div>

    <div class="box payment">
      <h3>Phương thức thanh toán</h3>
      <label><input type="radio" name="pay" checked/> Thanh toán khi nhận hàng</label>
      <label><input type="radio" name="pay"/> Chuyển khoản ngân hàng</label>
      <label><input type="radio" name="pay"/> Ví điện tử</label>
    </div>

    <div class="box">
      <h3>Sản phẩm</h3>

      <div class="item">
        <img src="https://via.placeholder.com/80"/>
        <div class="item-info">
          <div>Áo thun nam basic</div>
          <div class="price">120.000₫ x 1</div>
        </div>
      </div>

      <div class="item">
        <img src="https://via.placeholder.com/80"/>
        <div class="item-info">
          <div>Giày thể thao</div>
          <div class="price">350.000₫ x 2</div>
        </div>
      </div>

    </div>

  </div>

  <div class="right">

    <h3>Tóm tắt đơn hàng</h3>

    <div class="summary-line">
      <span>Tạm tính</span>
      <span>820.000₫</span>
    </div>

    <div class="summary-line">
      <span>Phí vận chuyển</span>
      <span>30.000₫</span>
    </div>

    <div class="summary-line total">
      <span>Tổng cộng</span>
      <span>850.000₫</span>
    </div>

    <button class="btn">Đặt hàng</button>

  </div>

</div>

</body>
</html>
