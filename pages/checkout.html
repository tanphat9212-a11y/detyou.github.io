<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thanh toán | DETYOU SHOP</title>

<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/header.css">
<link rel="stylesheet" href="../assets/css/footer.css">
<link rel="stylesheet" href="../assets/css/checkout.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header id="header"></header>

<main>

<section class="checkout-page">

<div class="container">

<div class="page-title">

<h1>

Thanh toán đơn hàng

</h1>

<p>

Vui lòng kiểm tra thông tin trước khi đặt hàng

</p>

</div>

<div class="checkout-layout">

<!-- ===========================
THÔNG TIN KHÁCH HÀNG
=========================== -->

<div class="checkout-left">

<div class="card">

<h2>

Thông tin người nhận

</h2>

<div class="form-grid">

<div class="form-group">

<label>

Họ và tên *

</label>

<input
type="text"
id="fullName"
placeholder="Nguyễn Văn A">

</div>

<div class="form-group">

<label>

Số điện thoại *

</label>

<input
type="tel"
id="phone"
placeholder="09xxxxxxxx">

</div>

<div class="form-group full">

<label>

Email

</label>

<input
type="email"
id="email"
placeholder="example@gmail.com">

</div>

<div class="form-group full">

<label>

Địa chỉ *

</label>

<input
type="text"
id="address"
placeholder="Số nhà, tên đường">

</div>

<div class="form-group">

<label>

Tỉnh / Thành phố

</label>

<select id="province">

<option value="">Chọn</option>

<option>Hà Nội</option>

<option>TP Hồ Chí Minh</option>

<option>Đà Nẵng</option>

<option>Cần Thơ</option>

<option>Hải Phòng</option>

<option>Bình Dương</option>

</select>

</div>

<div class="form-group">

<label>

Quận / Huyện

</label>

<input
type="text"
id="district"
placeholder="Quận / Huyện">

</div>

<div class="form-group">

<label>

Phường / Xã

</label>

<input
type="text"
id="ward"
placeholder="Phường / Xã">

</div>

<div class="form-group">

<label>

Mã bưu chính

</label>

<input
type="text"
id="zipcode"
placeholder="700000">

</div>

</div>

</div>

<!-- ========================= -->

<div class="card">

<h2>

Phương thức vận chuyển

</h2>

<label class="radio-item">

<input
type="radio"
name="shipping"
value="30000"
checked>

<span>

🚚 Giao hàng tiêu chuẩn (30.000đ)

</span>

</label>

<label class="radio-item">

<input
type="radio"
name="shipping"
value="50000">

<span>

⚡ Giao hàng nhanh (50.000đ)

</span>

</label>

<label class="radio-item">

<input
type="radio"
name="shipping"
value="0">

<span>

🏪 Nhận tại cửa hàng

</span>

</label>

</div>

<!-- ========================= -->

<div class="card">

<h2>

Phương thức thanh toán

</h2>

<label class="radio-item">

<input
type="radio"
name="payment"
value="cod"
checked>

<i class="fa-solid fa-money-bill-wave"></i>

Thanh toán khi nhận hàng (COD)

</label>

<label class="radio-item">

<input
type="radio"
name="payment"
value="momo">

<i class="fa-solid fa-wallet"></i>

Ví MoMo

</label>

<label class="radio-item">

<input
type="radio"
name="payment"
value="vnpay">

<i class="fa-solid fa-credit-card"></i>

VNPay

</label>

<label class="radio-item">

<input
type="radio"
name="payment"
value="bank">

<i class="fa-solid fa-building-columns"></i>

Chuyển khoản ngân hàng

</label>

</div>

<!-- ========================= -->

<div class="card">

<h2>

Ghi chú đơn hàng

</h2>

<textarea
id="note"
rows="5"
placeholder="Nhập ghi chú nếu có..."></textarea>

</div>

</div>

<!-- ===========================
ĐƠN HÀNG
=========================== -->

<div class="checkout-right">

<div class="order-box">

<h2>

Đơn hàng của bạn

</h2>

<div
id="checkoutItems">

</div>

<hr>

<div class="row">

<span>

Tạm tính

</span>

<strong id="checkoutSubtotal">

0đ

</strong>

</div>

<div class="row">

<span>

Vận chuyển

</span>

<strong id="checkoutShipping">

30.000đ

</strong>

</div>

<div class="row">

<span>

Giảm giá

</span>

<strong id="checkoutDiscount">

0đ

</strong>

</div>

<hr>

<div class="total">

<span>

Tổng cộng

</span>

<strong id="checkoutTotal">

0đ

</strong>

</div>

<div class="voucher-box">

<input
type="text"
id="voucherCode"
placeholder="Mã giảm giá">

<button
id="applyVoucher">

Áp dụng

</button>

</div>

<label class="agree">

<input
type="checkbox"
id="agreeTerms">

Tôi đồng ý với điều khoản mua hàng.

</label>

<button
id="placeOrder"
class="place-order">

<i class="fa-solid fa-lock"></i>

Đặt hàng ngay

</button>

</div>

</div>

</div>

</div>

</section>

</main>

<footer id="footer"></footer>

<script src="../assets/js/cart.js"></script>
<script src="../assets/js/checkout.js"></script>

</body>

</html>
