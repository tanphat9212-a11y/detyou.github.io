    <!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Detail</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f5f5f5;
    }

    header {
      background: #ee4d2d;
      padding: 10px 20px;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      display: flex;
      gap: 20px;
    }

    .left {
      flex: 1;
      background: white;
      padding: 15px;
    }

    .right {
      flex: 1;
      background: white;
      padding: 15px;
    }

    .main-img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 6px;
    }

    .thumbs {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .thumbs img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .thumbs img:hover {
      border: 2px solid #ee4d2d;
    }

    .title {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .price {
      color: #ee4d2d;
      font-size: 26px;
      margin: 10px 0;
    }

    .old-price {
      text-decoration: line-through;
      color: #888;
      margin-left: 10px;
      font-size: 14px;
    }

    .desc {
      margin-top: 15px;
      color: #333;
      line-height: 1.5;
    }

    .btn {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn button {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .add-cart {
      background: #ffeee8;
      color: #ee4d2d;
      border: 1px solid #ee4d2d;
    }

    .buy-now {
      background: #ee4d2d;
      color: white;
    }

    .qty {
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty button {
      width: 30px;
      height: 30px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
    }

    .qty input {
      width: 50px;
      text-align: center;
      height: 30px;
    }
  </style>
</head>

<body>

<header>
  Shopee Clone - Product Detail
</header>

<div class="container">

  <div class="left">
    <img id="mainImage" class="main-img" src="https://via.placeholder.com/600x400" />

    <div class="thumbs">
      <img src="https://via.placeholder.com/600x400/ff7f7f" onclick="changeImg(this)">
      <img src="https://via.placeholder.com/600x400/7fbfff" onclick="changeImg(this)">
      <img src="https://via.placeholder.com/600x400/7fff7f" onclick="changeImg(this)">
      <img src="https://via.placeholder.com/600x400/f7ff7f" onclick="changeImg(this)">
    </div>
  </div>

  <div class="right">
    <div class="title">Áo thun nam basic form rộng chất cotton cao cấp</div>

    <div>
      <span class="price">₫120.000</span>
      <span class="old-price">₫199.000</span>
    </div>

    <div class="qty">
      <button onclick="changeQty(-1)">-</button>
      <input id="qty" type="text" value="1"/>
      <button onclick="changeQty(1)">+</button>
    </div>

    <div class="btn">
      <button class="add-cart">Thêm vào giỏ</button>
      <button class="buy-now">Mua ngay</button>
    </div>

    <div class="desc">
      <h3>Mô tả sản phẩm</h3>
      <p>
        Áo thun nam chất cotton 100%, thoáng mát, thấm hút mồ hôi tốt.
        Form rộng trẻ trung, dễ phối đồ, phù hợp đi chơi, đi làm, đi học.
      </p>
    </div>
  </div>

</div>

<script>
  function changeImg(el) {
    document.getElementById("mainImage").src = el.src;
  }

  function changeQty(val) {
    let qty = document.getElementById("qty");
    let current = parseInt(qty.value) || 1;
    current += val;
    if (current < 1) current = 1;
    qty.value = current;
  }
</script>

</body>
</html>
