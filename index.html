<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopVN - Trang Chủ</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>

<body>

<header class="header">
  <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;">ShopVN</div>

  <div class="search">
    <input type="text" id="main-search-input" placeholder="Tìm sản phẩm..." />
    <button id="main-search-btn">🔍</button>
  </div>

  <div class="cart">🛒 Giỏ hàng</div>
</header>

<nav class="nav">
  <a href="index.html">Trang chủ</a>
  <a href="#">Thời trang</a>
  <a href="#">Giày dép</a>
  <a href="#">Điện tử</a>
  <a href="#">Phụ kiện</a>
</nav>

<section class="banner-carousel">
  <div class="slides" id="slides">
    <div class="slide active">
      <img src="assets/images/banners/banner1.jpg" onerror="this.src='https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=1200'">
      <div class="cta">
        <h2>Sale sốc 50%</h2>
        <button>Mua ngay</button>
      </div>
    </div>
  </div>
</section>

<section class="container">
  <h2>Sản phẩm nổi bật</h2>
  <div class="grid" id="productGrid"></div>
</section>

<footer class="footer">
  © 2026 ShopVN
</footer>

<script type="module">
import products from "./data/products.js";

const grid = document.getElementById("productGrid");

// Đổ dữ liệu sản phẩm ra trang chủ
if (products && grid) {
  products.forEach(p => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <img src="${p.images ? p.images[0] : 'https://via.placeholder.com/300'}"/>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="price">${p.price.toLocaleString()}₫</div>
        <button class="btn" onclick="location.href='product-detail.html?id=${p.id}'">Xem</button>
      </div>
    `;
    grid.appendChild(div);
  });
}

// XỬ LÝ CHUYỂN TRANG KHI TÌM KIẾM TRÊN THANH LỚN
const searchInput = document.getElementById("main-search-input");
const searchBtn = document.getElementById("main-search-btn");

function executeSearch() {
  const keyword = searchInput.value.trim();
  if (keyword !== "") {
    // Chuyển hướng tương đối bằng tên file, an toàn tuyệt đối trên GitHub Pages
    window.location.href = "search.html?q=" + encodeURIComponent(keyword);
  }
}

searchBtn.addEventListener("click", executeSearch);
searchInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") executeSearch();
});
</script>

</body>
</html>
