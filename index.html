<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopee Clone - Home</title>

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">ShopVN</div>

    <div class="search">
      <input type="text" placeholder="Tìm sản phẩm..." />
      <button>Tìm</button>
    </div>

    <div class="cart">
      🛒 Giỏ hàng
    </div>
  </header>

  <!-- NAV -->
  <nav class="nav">
    <a href="#">Trang chủ</a>
    <a href="#">Thời trang</a>
    <a href="#">Giày dép</a>
    <a href="#">Điện tử</a>
    <a href="#">Phụ kiện</a>
  </nav>

  <!-- CONTENT -->
  <div class="container">

    <h2 style="margin-bottom:15px;">Sản phẩm nổi bật</h2>

    <div class="grid" id="productGrid"></div>

  </div>

  <!-- FOOTER -->
  <div class="footer">
    © 2026 ShopVN - Clone Shopee UI
  </div>

  <script type="module">
    import products from "./data/products.js";

    const grid = document.getElementById("productGrid");

    function formatPrice(n) {
      return n.toLocaleString("vi-VN") + "₫";
    }

    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <img src="${p.images[0]}" />
        <div class="card-body">
          <div class="card-title">${p.name}</div>
          <div class="price">${formatPrice(p.price)}</div>
          <div class="old-price">${formatPrice(p.oldPrice)}</div>
          <button class="btn" onclick="location.href='product-detail.html?id=${p.id}'">
            Xem chi tiết
          </button>
        </div>
      `;

      grid.appendChild(card);
    });
  </script>

</body>
</html>
