<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ShopVN</title>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>

<body>

<header class="header">
  <div class="logo">ShopVN</div>

  <div class="search">
    <input type="text" placeholder="Tìm sản phẩm..." />
    <button>🔍</button>
  </div>

  <div class="cart">🛒 Giỏ hàng</div>
</header>

<nav class="nav">
  <a href="#">Trang chủ</a>
  <a href="#">Thời trang</a>
  <a href="#">Giày dép</a>
  <a href="#">Điện tử</a>
  <a href="#">Phụ kiện</a>
</nav>

<section class="hero">
  <div class="hero-content">
    <h1>Mua sắm hiện đại</h1>
    <p>Giá tốt - Giao nhanh - Uy tín</p>
    <button class="btn">Mua ngay</button>
  </div>
</section>

<section class="container">
  <h2>Sản phẩm nổi bật</h2>
  <div class="grid" id="productGrid"></div>
</section>

<footer class="footer">
  © 2026 ShopVN
</footer>

<script type="module">
import products from "./data/products.js";

const grid = document.getElementById("productGrid");

products.forEach(p => {
  const div = document.createElement("div");
  div.className = "card";

  div.innerHTML = `
    <img src="${p.images[0]}"/>
    <div class="card-body">
      <div class="card-title">${p.name}</div>
      <div class="price">${p.price.toLocaleString()}₫</div>
      <button class="btn" onclick="location.href='product-detail.html?id=${p.id}'">
        Xem
      </button>
    </div>
  `;

  grid.appendChild(div);
});
</script>

</body>
</html>
